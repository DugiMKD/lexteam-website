# Netlify: изворот е во site/ (трите јазици заедно). При секое објавување
# tools/build-lang.js прави посебни страници по јазик во dist/:
#   /страница.html (mk), /en/страница.html, /sq/страница.html
[build]
  publish = "dist"
  command = "node tools/build-lang.js"

[[headers]]
for = "/*"

  [headers.values]
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  X-Frame-Options = "SAMEORIGIN"
  Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
for = "/assets/*"

  [headers.values]
  Cache-Control = "public, max-age=2592000"

[[headers]]
for = "/css/*"

  [headers.values]
  Cache-Control = "public, max-age=604800"

[[headers]]
for = "/js/*"

  [headers.values]
  Cache-Control = "public, max-age=604800"

[[headers]]
for = "/blog/feed.xml"

  [headers.values]
  Content-Type = "application/rss+xml; charset=utf-8"

[[headers]]
for = "/llms.txt"

  [headers.values]
  Content-Type = "text/plain; charset=utf-8"

[[redirects]]
from = "https://www.lexteam.mk/*"
to = "https://lexteam.mk/:splat"
status = 301
force = true




[[redirects]]
from = "http://www.lexteam.mk/*"
to = "https://lexteam.mk/:splat"
status = 301
force = true



  [redirects.headers]

# Стари адреси со ?lang=en / ?lang=sq / ?lang=mk: на страницата на тој јазик.
[[redirects]]
from = "/*"
to = "/en/:splat"
status = 301
query = {lang = "en"}

[[redirects]]
from = "/*"
to = "/sq/:splat"
status = 301
query = {lang = "sq"}
